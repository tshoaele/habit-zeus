:root{
  --bg: #E9EAE4;
  --bg-raised: #F3F3EE;
  --ink: #1C2321;
  --ink-soft: #52584F;
  --line: #D3D4CB;
  --gold: #C99418;
  --gold-deep: #93700F;
  --indigo: #2B2E4A;
  --done-bg: #DCE7DB;
  --danger: #A33B2E;
  --radius: 10px;
  --maxw: 640px;
}

*{ box-sizing: border-box; }

html,body{
  margin:0;
  padding:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body{
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 28px 18px 90px;
}

.wrap{ width:100%; max-width: var(--maxw); }

header.app-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 6px;
}

.wordmark{
  font-weight:700;
  font-size: 34px;
  letter-spacing: 0.04em;
  line-height:1;
}

.wordmark .bolt{ color: var(--gold-deep); }

.tagline{
  font-size: 14px;
  color: var(--ink-soft);
  font-weight:500;
  letter-spacing: 0.02em;
}

.summary-row{
  display:flex;
  gap: 18px;
  margin: 14px 0 22px;
  font-size: 14px;
  color: var(--ink-soft);
  font-weight:500;
}

.summary-row b{
  color: var(--ink);
  font-weight:700;
  font-size: 16px;
}

form.add-row{
  display:flex;
  gap:8px;
  margin-bottom: 22px;
}

.add-row input[type=text]{
  flex:1;
  font-family:inherit;
  font-size: 18px;
  font-weight:500;
  padding: 10px 12px;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-raised);
  color: var(--ink);
}

.add-row input[type=text]:focus{
  outline:none;
  border-color: var(--indigo);
}

.add-row button{
  font-family:inherit;
  font-weight:700;
  font-size: 16px;
  letter-spacing:0.02em;
  padding: 0 18px;
  border-radius: var(--radius);
  border: 2px solid var(--ink);
  background: var(--ink);
  color: var(--bg);
  cursor:pointer;
}

.add-row button:active{ transform: translateY(1px); }

ul.habits{
  list-style:none;
  margin:0;
  padding:0;
  border-top: 1px solid var(--line);
}

li.habit{
  display:flex;
  align-items:center;
  gap: 14px;
  padding: 14px 2px;
  border-bottom: 1px solid var(--line);
}

.check{
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 7px;
  border: 2px solid var(--ink);
  background: var(--bg-raised);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.check svg{ width:18px; height:18px; opacity:0; }

li.habit.done .check{
  background: var(--done-bg);
  border-color: var(--indigo);
}

li.habit.done .check svg{ opacity:1; }

.habit-name{
  flex:1;
  font-size: 19px;
  font-weight:600;
  letter-spacing: 0.01em;
}

li.habit.done .habit-name{
  color: var(--ink-soft);
}

.streak{
  flex: 0 0 auto;
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:700;
  font-size: 18px;
  color: var(--gold-deep);
  min-width: 46px;
  justify-content:flex-end;
}

.streak svg{ width:14px; height:14px; }

.streak.zero{ color: var(--ink-soft); font-weight:500; }

.remove{
  flex:0 0 auto;
  border:none;
  background:none;
  color: var(--ink-soft);
  font-size: 20px;
  line-height:1;
  cursor:pointer;
  padding: 4px 6px;
}

.remove:hover{ color: var(--danger); }

.empty{
  padding: 30px 4px;
  color: var(--ink-soft);
  font-size:16px;
  font-weight:500;
}

footer.sig{
  position:fixed;
  right: 14px;
  bottom: 10px;
  font-size: 12px;
  font-weight:500;
  color: var(--ink-soft);
  letter-spacing:0.03em;
  opacity: 0.75;
}

@media (max-width: 420px){
  .wordmark{ font-size:28px; }
  .habit-name{ font-size:17px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="app-head">
    <div>
      <div class="wordmark"><span class="bolt">⚡</span>ZEUS</div>
      <div class="tagline">Discipline compounds daily.</div>
    </div>
  </header>

  <div class="summary-row">
    <div><b id="doneCount">0</b> done today</div>
    <div><b id="totalCount">0</b> habits</div>
    <div><b id="bestStreak">0</b> best streak</div>
  </div>

  <form class="add-row" id="addForm">
    <input type="text" id="newHabit" placeholder="Add a habit" maxlength="60" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <ul class="habits" id="habitList"></ul>
</div>

<footer class="sig">Vuja Tsoaela</footer>

<script>
const STORAGE_KEY = 'zeus_habits_v1';

const DEFAULT_HABITS = [
  '10x push ups',
  '10x squats',
  '10x sit ups',
  'Prayer',
  '10 minute meditation',
  'Goals writing',
  'Journaling',
  '5 min power visualization',
  '15 min reading',
  '1x podcast'
];

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function uid(){
  return 'h_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}

function loadHabits(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ raw = null; }
  if(!raw){
    raw = DEFAULT_HABITS.map(name => ({ id: uid(), name, streak: 0, lastCompletedDate: null }));
    saveHabits(raw);
  }
  return applyMissedDayReset(raw);
}

function applyMissedDayReset(habits){
  const today = todayStr();
  const yesterday = yesterdayStr();
  let changed = false;
  habits.forEach(h => {
    if(h.lastCompletedDate && h.lastCompletedDate !== today && h.lastCompletedDate !== yesterday && h.streak !== 0){
      h.streak = 0;
      changed = true;
    }
  });
  if(changed) saveHabits(habits);
  return habits;
}

function saveHabits(habits){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
}

let habits = loadHabits();

function render(){
  const list = document.getElementById('habitList');
  const today = todayStr();
  list.innerHTML = '';

  if(habits.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No habits yet. Add your first one above.';
    list.appendChild(empty);
  }

  let doneCount = 0;
  let best = 0;

  habits.forEach(h => {
    const doneToday = h.lastCompletedDate === today;
    if(doneToday) doneCount++;
    if(h.streak > best) best = h.streak;

    const li = document.createElement('li');
    li.className = 'habit' + (doneToday ? ' done' : '');

    const check = document.createElement('button');
    check.className = 'check';
    check.setAttribute('aria-label', doneToday ? 'Completed today' : 'Mark done today');
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    check.addEventListener('click', () => toggleHabit(h.id));

    const name = document.createElement('div');
    name.className = 'habit-name';
    name.textContent = h.name;

    const streak = document.createElement('div');
    streak.className = 'streak' + (h.streak === 0 ? ' zero' : '');
    streak.innerHTML = (h.streak > 0 ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>' : '') + h.streak;

    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.setAttribute('aria-label', 'Remove habit');
    remove.textContent = '\u00D7';
    remove.addEventListener('click', () => removeHabit(h.id));

    li.appendChild(check);
    li.appendChild(name);
    li.appendChild(streak);
    li.appendChild(remove);
    list.appendChild(li);
  });

  document.getElementById('doneCount').textContent = doneCount;
  document.getElementById('totalCount').textContent = habits.length;
  document.getElementById('bestStreak').textContent = best;
}

function toggleHabit(id){
  const today = todayStr();
  const yesterday = yesterdayStr();
  const h = habits.find(x => x.id === id);
  if(!h) return;

  if(h.lastCompletedDate === today){
    // undo today's check in
    h.lastCompletedDate = h.streak > 1 ? yesterday : null;
    h.streak = Math.max(0, h.streak - 1);
  } else {
    h.streak = (h.lastCompletedDate === yesterday) ? h.streak + 1 : 1;
    h.lastCompletedDate = today;
  }
  saveHabits(habits);
  render();
}

function removeHabit(id){
  habits = habits.filter(h => h.id !== id);
  saveHabits(habits);
  render();
}

document.getElementById('addForm').addEventListener('submit', function(e){
  e.preventDefault();
  const input = document.getElementById('newHabit');
  const name = input.value.trim();
  if(!name) return;
  habits.push({ id: uid(), name, streak: 0, lastCompletedDate: null });
  saveHabits(habits);
  input.value = '';
  render();
});

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
