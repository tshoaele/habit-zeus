:root{
  --bg: #E9EAE4;
  --bg-raised: #F3F3EE;
  --ink: #1C2321;
  --ink-soft: #52584F;
  --line: #D3D4CB;
  --gold: #C99418;
  --gold-deep: #93700F;
  --indigo: #2B2E4A;
  --done-bg: #DCE7DB;
  --danger: #A33B2E;
  --radius: 10px;
  --maxw: 680px;
}

*{ box-sizing: border-box; }

html,body{
  margin:0;
  padding:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body{
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 24px 16px 80px;
}

.wrap{ width:100%; max-width: var(--maxw); }

header.app-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 12px;
  margin-bottom: 14px;
}

.wordmark{
  font-weight:700;
  font-size: 32px;
  letter-spacing: 0.04em;
  line-height:1;
}

.wordmark .bolt{ color: var(--gold-deep); }

.tagline{
  font-size: 13px;
  color: var(--ink-soft);
  font-weight:500;
  letter-spacing: 0.02em;
}

/* Date Navigator & Controls */
.date-nav{
  display:flex;
  align-items:center;
  gap: 6px;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  padding: 4px 8px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
}

.date-nav button{
  background: none;
  border: none;
  color: var(--ink);
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: background 0.15s;
}
.date-nav button:hover{ background: var(--line); }

/* Controls bar */
.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0 16px;
}

.summary-row{
  display:flex;
  gap: 16px;
  font-size: 14px;
  color: var(--ink-soft);
  font-weight:600;
}

.summary-row b{
  color: var(--ink);
  font-size: 16px;
}

.btn-sm {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-sm:hover {
  background: var(--ink);
  color: var(--bg-raised);
}
.btn-gold {
  background: var(--gold);
  border-color: var(--gold-deep);
  color: #fff;
}
.btn-gold:hover {
  background: var(--gold-deep);
}

/* Add Row */
.add-row{
  display:flex;
  gap: 8px;
  margin-bottom: 20px;
}

.add-row input{
  flex:1;
  background: var(--bg-raised);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.add-row input:focus{
  outline:none;
  border-color: var(--gold-deep);
}

.add-row button{
  background: var(--ink);
  color: var(--bg);
  border:none;
  border-radius: var(--radius);
  padding: 0 20px;
  font-family: inherit;
  font-weight:700;
  font-size: 15px;
  cursor:pointer;
  transition: background 0.15s;
}
.add-row button:hover{ background: var(--gold-deep); color: #fff; }

/* Habit Cards List */
.habits{
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  flex-direction:column;
  gap: 8px;
}

.habit-item{
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition: all 0.2s;
}

.habit-item.done{
  background: var(--done-bg);
  border-color: #B5C9B3;
}

.habit-left{
  display:flex;
  align-items:center;
  gap: 12px;
  flex:1;
  min-width: 0;
}

.habit-cb{
  width: 22px;
  height: 22px;
  border: 2px solid var(--ink-soft);
  border-radius: 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition: all 0.15s;
  background: var(--bg);
  flex-shrink: 0;
}
.habit-item.done .habit-cb{
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.habit-name{
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  word-break: break-word;
}
.habit-item.done .habit-name{
  text-decoration: line-through;
  color: var(--ink-soft);
}

.habit-right{
  display:flex;
  align-items:center;
  gap: 10px;
  flex-shrink: 0;
}

.streak-tag{
  font-size: 13px;
  font-weight: 700;
  color: var(--gold-deep);
  background: rgba(201, 148, 24, 0.12);
  padding: 3px 8px;
  border-radius: 6px;
}

.action-btns{
  display:flex;
  gap: 4px;
  opacity: 0.6;
  transition: opacity 0.15s;
}
.habit-item:hover .action-btns{ opacity: 1; }

.icon-btn{
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  padding: 4px;
  color: var(--ink-soft);
  border-radius: 4px;
}
.icon-btn:hover{ color: var(--danger); background: rgba(163, 59, 46, 0.1); }

/* Heatmap Section */
.heatmap-card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 20px;
}

.heatmap-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.heatmap-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.grid-30 {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
}

.day-box {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  height: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s;
}
.day-box:hover { transform: scale(1.08); }

.day-box.lvl-0 { background: var(--bg); color: var(--ink-soft); }
.day-box.lvl-1 { background: #E2EADF; border-color: #B2CEAC; color: #2B4E26; }
.day-box.lvl-2 { background: #B5D7AE; border-color: #83B879; color: #1B3817; }
.day-box.lvl-3 { background: var(--gold); border-color: var(--gold-deep); color: #FFF; }

/* Rank Badge Card */
.rank-card {
  background: var(--bg-raised);
  border: 1.5px solid var(--gold);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin: 14px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.rank-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-deep);
  letter-spacing: 0.05em;
}

/* Modals & Inputs */
.hidden { display: none !important; }

footer.sig{
  margin-top:auto;
  padding-top:40px;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing:0.06em;
  text-transform:uppercase;
  font-weight:600;
}
</style>
</head>
<body>

  <div class="wrap">
    <header class="app-head">
      <div>
        <div class="wordmark"><span class="bolt">⚡</span>ZEUS</div>
        <div class="tagline">Discipline compounds daily.</div>
      </div>
      <!-- Date Navigator -->
      <div class="date-nav">
        <button id="prevDayBtn" title="Previous Day">‹</button>
        <span id="dateDisplay">Today</span>
        <button id="nextDayBtn" title="Next Day">›</button>
        <button id="todayBtn" style="color:var(--gold-deep)">Today</button>
      </div>
    </header>

    <!-- Rank & Discipline Banner -->
    <div class="rank-card">
      <div>
        <span style="font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase;">Discipline Rank</span>
        <div class="rank-title" id="rankTitle">Spartan</div>
      </div>
      <div style="text-align:right;">
        <span style="font-size:12px; font-weight:700; color:var(--ink-soft);" id="rankScore">0 Points</span>
        <div style="font-size:11px; color:var(--gold-deep);" id="rankSub">Keep momentum alive</div>
      </div>
    </div>

    <!-- Summary Row & Controls -->
    <div class="controls-bar">
      <div class="summary-row">
        <div><b id="doneCount">0</b> done</div>
        <div><b id="totalCount">0</b> habits</div>
        <div><b id="bestStreak">0</b> max streak</div>
      </div>

      <div style="display:flex; gap:6px;">
        <button class="btn-sm" id="toggleHeatmapBtn">📊 Heatmap</button>
        <button class="btn-sm" id="exportBtn">📥 Backup</button>
        <button class="btn-sm" id="importBtn">📤 Restore</button>
      </div>
    </div>

    <!-- Add Habit Form -->
    <form class="add-row" id="addForm">
      <input type="text" id="newHabit" placeholder="Add a habit (e.g. 10x Pushups)" maxlength="60" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <!-- Habit Cards List -->
    <ul class="habits" id="habitList"></ul>

    <!-- 30-Day Activity Heatmap -->
    <div class="heatmap-card hidden" id="heatmapCard">
      <div class="heatmap-head">
        <div class="heatmap-title">30-Day Consistency Heatmap</div>
        <div style="font-size:11px; color:var(--ink-soft);">Darker = Higher Completion</div>
      </div>
      <div class="grid-30" id="heatmapGrid"></div>
    </div>
  </div>

  <footer class="sig">Vuja Tsoaela</footer>

  <input type="file" id="importFile" class="hidden" accept=".json">
  <canvas id="confettiCanvas" style="pointer-events:none; position:fixed; inset:0; z-index:99; width:100%; height:100%;"></canvas>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
        }).catch(err => console.log('SW Registration:', err));
      });
    }

    // --- STATE & DATA STORAGE ---
    const STORAGE_KEY = 'zeus_habits_v1';
    const STORAGE_LOGS_KEY = 'zeus_logs_v1';

    const DEFAULT_HABITS = [
      '10x push ups',
      '10x squats',
      '10x sit ups',
      'Prayer',
      '10 minute meditation',
      'Goals writing',
      'Journaling',
      '5 min power visualization',
      '15 min reading',
      '1x podcast'
    ];

    let habits = [];
    let logs = {}; // { "YYYY-MM-DD": { "habitId": true } }
    let selectedDate = new Date();

    function formatDateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDisplayDate(d) {
      const todayKey = formatDateKey(new Date());
      const selectedKey = formatDateKey(d);
      if (todayKey === selectedKey) return 'Today';

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (formatDateKey(yesterday) === selectedKey) return 'Yesterday';

      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
    }

    function uid() {
      return 'h_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function loadData() {
      let rawHabits;
      try { rawHabits = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { rawHabits = null; }
      
      if (!rawHabits || !Array.isArray(rawHabits) || rawHabits.length === 0) {
        rawHabits = DEFAULT_HABITS.map(name => ({ id: uid(), name, streak: 0, lastCompletedDate: null }));
      }
      habits = rawHabits;

      let rawLogs;
      try { rawLogs = JSON.parse(localStorage.getItem(STORAGE_LOGS_KEY)); } catch (e) { rawLogs = null; }
      logs = rawLogs || {};

      saveData();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
      localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(logs));
    }

    // --- STREAK COMPUTATION ---
    function calculateStreak(habitId) {
      let streak = 0;
      let checkDate = new Date();
      const todayKey = formatDateKey(checkDate);
      
      if (!logs[todayKey] || !logs[todayKey][habitId]) {
        checkDate.setDate(checkDate.getDate() - 1);
      }

      while (true) {
        const k = formatDateKey(checkDate);
        if (logs[k] && logs[k][habitId]) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    // --- RENDER APP ---
    function renderApp() {
      document.getElementById('dateDisplay').textContent = formatDisplayDate(selectedDate);
      const dateKey = formatDateKey(selectedDate);

      const listEl = document.getElementById('habitList');
      listEl.innerHTML = '';

      let doneTodayCount = 0;
      let maxStreakAllTime = 0;

      habits.forEach(h => {
        const isDone = logs[dateKey] && !!logs[dateKey][h.id];
        if (isDone) doneTodayCount++;

        const currentStreak = calculateStreak(h.id);
        if (currentStreak > maxCurrentStreak) maxCurrentStreak = currentStreak;

        const li = document.createElement('li');
        li.className = `habit-item ${isDone ? 'done' : ''}`;
        li.innerHTML = `
          <div class="habit-left">
            <div class="habit-cb" onclick="toggleHabit('${h.id}')">
              ${isDone ? '✓' : ''}
            </div>
            <span class="habit-name">${escapeHTML(h.name)}</span>
          </div>
          <div class="habit-right">
            <span class="streak-tag">🔥 ${currentStreak}d</span>
            <div class="action-btns">
              <button class="icon-btn" title="Edit" onclick="editHabit('${h.id}')">✏️</button>
              <button class="icon-btn" title="Delete" onclick="deleteHabit('${h.id}')">🗑️</button>
            </div>
          </div>
        `;
        listEl.appendChild(li);
      });

      // Update Summary
      document.getElementById('doneCount').textContent = doneTodayCount;
      document.getElementById('totalCount').textContent = habits.length;

      // Max Streak
      let globalMaxStreak = 0;
      habits.forEach(h => {
        const s = calculateStreak(h.id);
        if (s > globalMaxStreak) globalMaxStreak = s;
      });
      document.getElementById('bestStreak').textContent = globalMaxStreak;

      // Calculate Rank
      const totalCheckins = Object.values(logs).reduce((acc, obj) => acc + Object.values(obj).filter(Boolean).length, 0);
      let rank = 'Initiate';
      if (totalCheckins >= 10) rank = 'Disciple';
      if (totalCheckins >= 30) rank = 'Spartan';
      if (totalCheckins >= 75) rank = 'Olympian';
      if (totalCheckins >= 150) rank = 'Zeus Sovereign';

      document.getElementById('rankTitle').textContent = rank;
      document.getElementById('rankScore').textContent = `${totalCheckins * 10} Points`;

      renderHeatmap();
    }

    let maxCurrentStreak = 0;

    function toggleHabit(id) {
      const dateKey = formatDateKey(selectedDate);
      if (!logs[dateKey]) logs[dateKey] = {};

      const prev = !!logs[dateKey][id];
      logs[dateKey][id] = !prev;

      saveData();
      renderApp();

      // Confetti celebration if 100% completed today
      const todayKey = formatDateKey(new Date());
      if (dateKey === todayKey && !prev) {
        const allDone = habits.every(h => logs[todayKey] && logs[todayKey][h.id]);
        if (allDone && habits.length > 0) triggerConfetti();
      }
    }

    function editHabit(id) {
      const h = habits.find(x => x.id === id);
      if (!h) return;
      const newName = prompt('Edit habit name:', h.name);
      if (newName && newName.trim()) {
        h.name = newName.trim();
        saveData();
        renderApp();
      }
    }

    function deleteHabit(id) {
      if (confirm('Delete this habit?')) {
        habits = habits.filter(x => x.id !== id);
        saveData();
        renderApp();
      }
    }

    function renderHeatmap() {
      const grid = document.getElementById('heatmapGrid');
      grid.innerHTML = '';

      const today = new Date();
      for (let i = 29; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const k = formatDateKey(d);

        const count = logs[k] ? Object.values(logs[k]).filter(Boolean).length : 0;
        const total = habits.length || 1;
        const ratio = count / total;

        let lvl = 'lvl-0';
        if (ratio > 0 && ratio <= 0.4) lvl = 'lvl-1';
        else if (ratio > 0.4 && ratio <= 0.8) lvl = 'lvl-2';
        else if (ratio > 0.8) lvl = 'lvl-3';

        const dayNum = d.getDate();
        const monthStr = d.toLocaleDateString('en-US', { month: 'short' });

        const box = document.createElement('div');
        box.className = `day-box ${lvl}`;
        box.title = `${monthStr} ${dayNum}: ${count}/${total} done`;
        box.onclick = () => {
          selectedDate = new Date(d);
          renderApp();
        };

        box.innerHTML = `<span>${dayNum}</span>`;
        grid.appendChild(box);
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#C99418', '#93700F', '#1C2321', '#2B4E26', '#83B879'];

      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.4,
          vx: (Math.random() - 0.5) * 5,
          vy: Math.random() * 3 + 2,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360
        });
      }

      let opacity = 1;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
          ctx.restore();
        });
        opacity -= 0.02;
        canvas.style.opacity = Math.max(0, opacity);
        if (opacity > 0) requestAnimationFrame(draw);
        else canvas.style.opacity = '1';
      }
      draw();
    }

    // --- EVENT LISTENERS ---
    document.getElementById('addForm').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('newHabit');
      const val = input.value.trim();
      if (val) {
        habits.push({ id: uid(), name: val, streak: 0, lastCompletedDate: null });
        input.value = '';
        saveData();
        renderApp();
      }
    };

    document.getElementById('prevDayBtn').onclick = () => {
      selectedDate.setDate(selectedDate.getDate() - 1);
      renderApp();
    };
    document.getElementById('nextDayBtn').onclick = () => {
      selectedDate.setDate(selectedDate.getDate() + 1);
      renderApp();
    };
    document.getElementById('todayBtn').onclick = () => {
      selectedDate = new Date();
      renderApp();
    };

    document.getElementById('toggleHeatmapBtn').onclick = () => {
      document.getElementById('heatmapCard').classList.toggle('hidden');
    };

    document.getElementById('exportBtn').onclick = () => {
      const data = { habits, logs, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `zeus-backup-${formatDateKey(new Date())}.json`;
      a.click();
    };

    document.getElementById('importBtn').onclick = () => {
      document.getElementById('importFile').click();
    };

    document.getElementById('importFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.habits && parsed.logs) {
            habits = parsed.habits;
            logs = parsed.logs;
            saveData();
            renderApp();
            alert('Backup restored!');
          }
        } catch(err) { alert('Invalid backup file'); }
      };
      r.readAsText(file);
    };

    // Load and Start
    loadData();
    renderApp();
  </script>
</body>
</html>
